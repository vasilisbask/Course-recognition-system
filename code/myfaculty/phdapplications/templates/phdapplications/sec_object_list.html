{% extends 'phdapplications/phdapp.html' %}
{% load phdapp_tags %}
{% block middle %}
  
<script>
    $(document).ready(function() {
      $('#objs').DataTable({
        "lengthChange": false,
        "pageLength": 100,
        "order" : [[ 0, "desc" ]],
      }
      );
    });
  </script>
<div class="row">
  <div class="col">
    <h3> {{ table_title }}</h3>
  </div>
  <div class="d-flex justify-content-end">
    <a href="{% url 'phdapplications:sec_create' obj_type applicant.pk %}" class="btn btn-primary" >
      + {{ create_text }}
    </a>
  </div>
</div> 
</br>
{% if objs %}  
<table id="objs" class="table">
    {{ objs|table_headers }}    
  </tbody>
  {% for p in objs %}
  {{ p|as_sec_table_row }}
  {% endfor %}
  </tbody>
  </table>
  {% else %}
  <p> {{ empty_text }}</p>
  {% endif %}
  {% endblock %}
