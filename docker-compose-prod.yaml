services:
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  
  web:
    build: .
    # command: python manage.py runserver 0.0.0.0:8000
    command: "gunicorn --workers=8 --bind=0.0.0.0:8000 myfaculty.wsgi:application" 
    restart: unless-stopped
    volumes:
      - ./code/myfaculty:/code
      - static:/code/static
          
    # ports:
    #   - "8000:8000"
    environment:
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - AUTH_LDAP_BIND_DN=${AUTH_LDAP_BIND_DN}
      - AUTH_LDAP_BIND_PASSWORD=${AUTH_LDAP_BIND_PASSWORD}
      - AUTH_LDAP_SERVER_URI=${AUTH_LDAP_SERVER_URI}
      - SIS_KEYCLOAK_TOKEN_URL=${SIS_KEYCLOAK_TOKEN_URL}
      - SIS_CLIENT_ID=${SIS_CLIENT_ID}
      - SIS_USER_NAME=${SIS_USER_NAME}
      - SIS_PASSWD=${SIS_PASSWD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DEBUG=False
      - DUMMY_EMAILS=False
      - BUDI_KEY=${BUDI_KEY}
      - RECAPTCHA_PUBLIC_KEY=${RECAPTCHA_PUBLIC_KEY}
      - RECAPTCHA_PRIVATE_KEY=${RECAPTCHA_PRIVATE_KEY}

    depends_on:
      - db

  nginx:
    image: nginx
    volumes:
      - static:/static
      - ./code/myfaculty/media:/media
      - ./nginx:/etc/nginx/conf.d
    restart: unless-stopped
    ports: 
      - "30100:30100"
    depends_on:
      - web
#    container_name: faculty-nginx

  redis:
    image: redis:7

  worker:
    build: .
    command: celery -A myfaculty worker --loglevel=INFO
    volumes:
      - ./code/myfaculty:/code
      - static:/code/static
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - POSTGRES_NAME=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - AUTH_LDAP_BIND_DN=${AUTH_LDAP_BIND_DN}
      - AUTH_LDAP_BIND_PASSWORD=${AUTH_LDAP_BIND_PASSWORD}
      - AUTH_LDAP_SERVER_URI=${AUTH_LDAP_SERVER_URI}
      - SIS_KEYCLOAK_TOKEN_URL=${SIS_KEYCLOAK_TOKEN_URL}
      - SIS_CLIENT_ID=${SIS_CLIENT_ID}
      - SIS_USER_NAME=${SIS_USER_NAME}
      - SIS_PASSWD=${SIS_PASSWD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DEBUG=False
      - DUMMY_EMAILS=False
      - BUDI_KEY=${BUDI_KEY}
      - RECAPTCHA_PUBLIC_KEY=${RECAPTCHA_PUBLIC_KEY}
      - RECAPTCHA_PRIVATE_KEY=${RECAPTCHA_PRIVATE_KEY}

    depends_on:
      - db

volumes:
  static:
  media:
